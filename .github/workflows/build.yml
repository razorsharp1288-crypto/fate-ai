name: Test and build Windows installer

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  windows-installer:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/make_icon.py
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python scripts/write_version_info.py
      - run: pyinstaller --noconfirm fate_ai.spec
      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\FateAI\FateAI.exe -ArgumentList "--smoke-test","--data-dir","$env:RUNNER_TEMP\fate-smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke test failed with $($p.ExitCode)" }
          Get-Content "$env:RUNNER_TEMP\fate-smoke\logs\fate.log"
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = python -c "import fate_ai; print(fate_ai.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\fate_ai.iss
          Push-Location installer\Output
          Get-ChildItem *.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Out-File -Encoding ascii SHA256SUMS.txt
          Pop-Location
      - name: Silent install / launch / uninstall test
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer\Output\*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER" -Wait
          $exe = "$env:LOCALAPPDATA\Programs\FATE AI\FateAI.exe"
          if (-not (Test-Path $exe)) { throw "not installed" }
          $p = Start-Process $exe -ArgumentList "--smoke-test","--data-dir","$env:RUNNER_TEMP\fate-installed" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installed app failed" }
          Start-Process "$env:LOCALAPPDATA\Programs\FATE AI\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          Start-Sleep 3
          if (Test-Path $exe) { throw "uninstall left the executable behind" }
      - uses: actions/upload-artifact@v4
        with:
          name: FateAI-windows
          path: |
            installer/Output/*.exe
            installer/Output/SHA256SUMS.txt
      - name: Read version
        id: ver
        shell: pwsh
        run: echo "version=$(python -c 'import fate_ai; print(fate_ai.__version__)')" >> $env:GITHUB_OUTPUT
      - name: Publish GitHub Release (version tags or manual runs)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: FATE AI ${{ steps.ver.outputs.version }}
          body: |
            **Download `FateAI-${{ steps.ver.outputs.version }}-setup.exe` below and run it.**

            - Windows 10 (1809+) / Windows 11, 64-bit. Installs for your user only — no admin rights needed.
            - The installer is not code-signed yet: if Windows SmartScreen says "Windows protected your PC",
              click **More info → Run anyway**.
            - Verify the download (optional): compare `Get-FileHash FateAI-${{ steps.ver.outputs.version }}-setup.exe` with `SHA256SUMS.txt`.
            - For local AI install [Ollama](https://ollama.com/download); for cloud AI add your own OpenAI/Anthropic key in the app.
            - If something goes wrong, the error is saved to `%LOCALAPPDATA%\FateAI\logs\crash.log`.
          files: |
            installer/Output/*.exe
            installer/Output/SHA256SUMS.txt
