[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fate-ai"
dynamic = ["version"]
description = "FATE AI — local-first desktop AI platform: chat, local models, sandboxes and virtual machines."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.7", "pydantic>=2.7", "httpx>=0.27", "psutil>=5.9", "keyring>=25",
  "Markdown>=3.6", "Pygments>=2.18", "pypdf>=4", "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6.6"]

[project.gui-scripts]
fate-ai = "fate_ai.main:main"

[tool.setuptools.dynamic]
version = { attr = "fate_ai.__version__" }

[tool.setuptools.packages.find]
include = ["fate_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
